name: Docs update
description: Something missing or wrong in docs/ or a folder README. A setup problem you solved also belongs here.
labels: ["documentation"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What was missing or wrong
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: The fix or the missing information
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where it should go
      description: The file or folder README this belongs in.
      placeholder: docs/development.md
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/phaemos/.github/blob/main/AI_POLICY.md). Dictation, translation and spelling tools do not count."
      options:
        - None
        - "Assisted: AI helped me find, test or check it"
    validations:
      required: true
