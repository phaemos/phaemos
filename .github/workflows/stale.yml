name: Stale

on:
  schedule:
    # I run this daily at 01:00 UTC to keep the issue tracker tidy without
    # spamming contributors during working hours.
    - cron: '0 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has had no activity for 60 days and has been marked as
            stale. It will be closed in 14 days unless there is new activity.
            If this is still relevant, please leave a comment or remove the
            stale label.
          close-issue-message: >
            This issue was closed automatically after 14 days of inactivity
            following the stale label. Feel free to reopen it if the problem
            persists.
          stale-pr-message: >
            This pull request has had no activity for 60 days and has been
            marked as stale. It will be closed in 14 days unless there is new
            activity.
          close-pr-message: >
            This pull request was closed automatically after 14 days of
            inactivity following the stale label.
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,in-progress
          exempt-pr-labels: pinned,security,in-progress
