# publishes each component folder to its own read-only repository.
# git subtree split is deterministic, so every publish is a fast-forward of the copy.
# messages, authors and dates stay as they are in this repository.

name: Publish components

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-components
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        folder: [backend, frontend, firmware, hardware, infra, client, edge, discord]
    steps:
      - name: Check for the publishing token
        id: token
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          if [ -n "$SPLIT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "SPLIT_TOKEN is not set, nothing was published" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          # the latest main rather than the pushed commit, so a late push event never publishes stale history.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Split and push
        if: steps.token.outputs.present == 'true'
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          FOLDER: ${{ matrix.folder }}
        run: |
          git subtree split --prefix="$FOLDER" --branch "publish-$FOLDER"
          # the copies are read-only mirrors of this folder, so their main always takes the split result
          # the token goes in a request header and not in the address, so it is in no URL or remote
          auth="$(printf 'x-access-token:%s' "${SPLIT_TOKEN}" | base64 -w0)"
          header="AUTHORIZATION: basic ${auth}"
          # the base64 form is not the token, so the log masking does not know it. Both forms and the
          # whole header are masked before anything uses them
          echo "::add-mask::${SPLIT_TOKEN}"
          echo "::add-mask::${auth}"
          echo "::add-mask::${header}"
          git -c "http.https://github.com/.extraheader=${header}" push --force "https://github.com/phaemos/${FOLDER}.git" "publish-$FOLDER:main"
