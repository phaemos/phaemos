# publishes each component folder to its own read-only repository.
# git subtree split is deterministic, so every publish is a fast-forward and
# the published history keeps each commit's original author and message.

name: Publish components

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-components
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.folder }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [backend, frontend, firmware, hardware]
    steps:
      - name: Check for the publishing token
        id: token
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          if [ -n "$SPLIT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "SPLIT_TOKEN is not set, nothing was published" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split and push
        if: steps.token.outputs.present == 'true'
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          FOLDER: ${{ matrix.folder }}
        run: |
          git subtree split --prefix="$FOLDER" --branch "publish-$FOLDER"
          git push "https://x-access-token:${SPLIT_TOKEN}@github.com/phaemos/${FOLDER}.git" "publish-$FOLDER:main"
