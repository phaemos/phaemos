# CI pipeline - runs on every push to main and every pull request targeting main.
#
# Jobs:
#   backend-lint  - installs Python deps and runs ruff for style and error checks
#   frontend-check - installs Node deps, runs ESLint and performs a production build
#
# Third-party actions are pinned to a full commit SHA to prevent a mutable tag
# (e.g. @v4) from silently updating to malicious code (supply-chain hardening).
#
# GITHUB_TOKEN is scoped to the minimum required permissions for each job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default: no permissions - each job declares only what it needs.
permissions: {}

jobs:
  # ── Backend lint ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest

    permissions:
      contents: read # needed to checkout the repository

    steps:
      # Checkout the repository source code
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up Python 3.11 matching the production runtime
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Install ruff for fast Python linting - not a full requirements install
      # because we only need the linter, not every runtime dependency
      - name: Install ruff
        run: pip install ruff==0.4.4

      # Run ruff against the backend source tree.
      # Exits with a non-zero code if any rule fires, failing the job.
      - name: Lint backend
        run: ruff check backend/

  # ── Backend tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    needs: backend-lint  # only run tests if lint passes

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # I pull the image explicitly so transient Docker Hub timeouts can be retried.
      # Service containers start before any steps and cannot be retried on failure.
      - name: Pull PostgreSQL image
        run: |
          for i in 1 2 3 4 5; do
            docker pull postgres:15 && break
            echo "Pull attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=phaemos_test \
            -p 5432:5432 \
            postgres:15
          until docker exec postgres pg_isready -U postgres; do sleep 1; done

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ --cov=app --cov-report=term-missing -v
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/phaemos_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          REDIS_URL: redis://localhost:6379

  # ── Frontend check ───────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend lint and build (Next.js)
    runs-on: ubuntu-latest

    permissions:
      contents: read # needed to checkout the repository

    steps:
      # Checkout the repository source code
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up Node 20 LTS with npm cache for faster installs
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Clean install from package-lock.json for a deterministic dependency tree
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Run ESLint - fails if any error-level rule fires
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Run the Next.js production build to catch TypeScript errors and broken imports.
      # Environment variables that the build references are set as placeholders -
      # real values are not needed for a build-only check.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://placeholder
