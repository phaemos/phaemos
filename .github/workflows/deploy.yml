# deploy pipeline: runs automatically after CI passes on pushes to main.
#
# backend: triggers a Render deploy hook via HTTP POST.
# frontend: Vercel auto-deploys via its own GitHub integration (no step needed here).
#
# set RENDER_DEPLOY_HOOK_URL as a GitHub Actions secret in repo settings.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

# one deploy at a time. A deploy in progress is never cancelled
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # only deploy when CI actually passed, never deploy broken code. The run must also be a push
    # from this repository. The branch filter above matches the head branch name, so a fork's
    # pull request from a branch called main would otherwise start a production deploy
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}

    # the job reads no repository content and needs no token rights
    permissions: {}

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        # the address is a secret, so it is read from the environment and never written in the
        # script. curl's output is discarded and the error line (which names the address) is
        # replaced by a fixed message, so a failure cannot print it
        run: |
          if ! curl --silent --fail --max-time 60 -X POST --output /dev/null -- "${RENDER_DEPLOY_HOOK_URL}" 2> /dev/null; then
            echo "the deploy hook request failed" >&2
            exit 1
          fi
