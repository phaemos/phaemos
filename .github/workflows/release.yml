# release workflow - runs when a semantic version tag is pushed.
#
# purpose: validate that CHANGELOG.md contains a matching version heading.
# the signed tag and the GitHub release are created by a maintainer, so this
# workflow only checks and never publishes.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Validate changelog
    runs-on: ubuntu-latest

    steps:
      # check out the repository at the tagged commit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # extract the version string from the Git ref.
      # example: refs/tags/v0.3.0 -> 0.3.0
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ensure CHANGELOG.md has a heading for this version.
      # expected format: ## [0.3.0] - YYYY-MM-DD (Keep a Changelog uses ISO dates)
      - name: Validate changelog entry
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -Eq "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "Missing changelog section for version ${VERSION}."
            echo "Expected line format: ## [${VERSION}] - YYYY-MM-DD"
            exit 1
          fi
