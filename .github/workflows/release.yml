# release workflow - runs when a semantic version tag is pushed.
#
# purpose:
# 1) Validate that CHANGELOG.md contains a matching version heading.
# 2) Create a GitHub release entry from the pushed tag.
#
# this ties repository version tags directly to changelog discipline.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required for creating a GitHub release

jobs:
  release:
    name: Validate changelog and publish release
    runs-on: ubuntu-latest

    steps:
      # check out the repository at the tagged commit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # extract the version string from the Git ref.
      # example: refs/tags/v0.3.0 -> 0.3.0
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ensure CHANGELOG.md has a heading for this version.
      # expected format: ## [0.3.0] - DD-MM-YYYY
      - name: Validate changelog entry
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -Eq "^## \[${VERSION}\] - [0-9]{2}-[0-9]{2}-[0-9]{4}$" CHANGELOG.md; then
            echo "Missing changelog section for version ${VERSION}."
            echo "Expected line format: ## [${VERSION}] - DD-MM-YYYY"
            exit 1
          fi

      # create a GitHub Release from the tag.
      # release notes are generated automatically from merged pull requests.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
