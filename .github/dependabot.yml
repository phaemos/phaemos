# Dependabot configuration.
# Checks for outdated dependencies weekly and opens a pull request for each
# update so dependency upgrades are reviewed rather than applied silently.

version: 2

updates:
  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Node.js frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # eslint-plugin-react (bundled inside eslint-config-next) does not support ESLint 10 yet,
      # its react/display-name rule calls a context API ESLint 10 removed. Real upstream gap, not
      # fixable here, tracked at jsx-eslint/eslint-plugin-react#3977 and vercel/next.js#89764.
      # Remove this once eslint-plugin-react ships v10 support.
      - dependency-name: "eslint"
        versions: ["10.x"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # GitHub Actions workflow dependencies (pins action versions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"
