# Dependabot configuration.
# Checks for outdated dependencies weekly and opens a pull request for each
# update so dependency upgrades are reviewed rather than applied silently.

version: 2

updates:
  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Node.js frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # GitHub Actions workflow dependencies (pins action versions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"
