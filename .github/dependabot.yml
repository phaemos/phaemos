# dependabot configuration.
# checks for outdated dependencies every Sunday at 18:00 UK time and opens a pull request for each
# update so dependency upgrades are reviewed rather than applied silently.

version: 2

updates:
  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      backend-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # SQLAlchemy 2.1 makes a bare postgresql:// URL use the psycopg (v3) driver. This backend runs
      # on psycopg2-binary, so the test suite fails to import and production would too. Moving means
      # a driver change tested against the real database. Remove this once that migration is done.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Node.js frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      frontend-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # eslint-plugin-react (bundled inside eslint-config-next) does not support ESLint 10 yet,
      # its react/display-name rule calls a context API ESLint 10 removed. Real upstream gap, not
      # fixable here, tracked at jsx-eslint/eslint-plugin-react#3977 and vercel/next.js#89764.
      # remove this once eslint-plugin-react ships v10 support.
      - dependency-name: "eslint"
        versions: ["10.x"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Discord server tooling: only the development tools, since the script and the relay use
  # nothing outside the standard library
  - package-ecosystem: "pip"
    directory: "/discord"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      discord-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Discord slash command worker (Cloudflare Workers)
  - package-ecosystem: "npm"
    directory: "/discord/worker"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      discord-worker-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Rust edge gateway dependencies
  - package-ecosystem: "cargo"
    directory: "/edge"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      edge-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Python SDK and simulator dependencies
  - package-ecosystem: "pip"
    directory: "/client/python"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      client-python-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Go command line tool dependencies
  - package-ecosystem: "gomod"
    directory: "/client/go"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      client-go-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # Docker images in the deployment stack
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      infra-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  # GitHub Actions workflow dependencies (pins action versions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"
