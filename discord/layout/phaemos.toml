# The PHAEMOS community server, described once. Edit this file, open a pull request, then run
# "serverkit plan" and "serverkit apply" (see ../README.md). No id, token or webhook address belongs here.
schema = 1

[server]
name = "PHAEMOS"
description = "The community for PHAEMOS, the open platform for predictive maintenance."
preferred_locale = "en-GB"
verification_level = 2
explicit_content_filter = 2
default_message_notifications = 1
system_channel = "welcome"
# system_channel_flags: 6 = SUPPRESS_PREMIUM_SUBSCRIPTIONS (1 << 1, boost notices off) + SUPPRESS_GUILD_REMINDER_NOTIFICATIONS
# (1 << 2, setup tips off). Join notices stay on (1 << 0 not set) and the join sticker replies stay allowed (1 << 3 not set)
system_channel_flags = 6
rules_channel = "rules"
public_updates_channel = "moderator-only"
safety_alerts_channel = "moderator-only"
# where the script posts a short summary after a run that changed something
summary_channel = "mod-log"

# the look of the messages the script posts. The accent colour is the brand's primary colour (#2563EB, from
# assets/brand/README.md in the repository). The two images are copies of brand files kept in assets/ so that this
# folder stands alone. Colour carries no meaning: every word is in the text of the message
[brand]
colour = 2450411
logo = "assets/logo.png"
banner = "assets/banner.png"
tagline = "Reveal before failure"
logo_alt = "The PHAEMOS mark"
banner_alt = "The PHAEMOS banner, with the name and the words Reveal before failure"

[permission_sets]
member = [
  "view_channel", "send_messages", "send_messages_in_threads", "create_public_threads",
  "read_message_history", "add_reactions", "embed_links", "attach_files",
  "use_application_commands", "change_nickname",
]
moderator = ["moderate_members", "manage_messages", "manage_nicknames", "pin_messages"]
maintainer = [
  "kick_members", "ban_members", "manage_threads", "view_audit_log", "mention_everyone",
  "bypass_slowmode", "send_polls", "create_events", "manage_events",
]
read_only = ["send_messages", "send_messages_in_threads", "create_public_threads"]
bot_write = ["view_channel", "send_messages", "read_message_history"]

[everyone]
permissions = ["@member"]

[[roles]]
name = "Maintainer"
# made and edited by hand. The script only checks it
owner = true
permissions = ["@moderator", "@maintainer"]
hoist = true
mentionable = false
colour = 0

[[roles]]
name = "Moderator"
# made and edited by hand. The script only checks it
owner = true
permissions = ["@moderator"]
hoist = true
mentionable = false
colour = 0

[[roles]]
name = "Contributor"
permissions = []
hoist = true
mentionable = false
colour = 0

[[roles]]
name = "Operator"
permissions = []
hoist = false
mentionable = false
colour = 0

[[roles]]
name = "Hardware builder"
permissions = []
hoist = false
mentionable = false
colour = 0

[[roles]]
name = "Developer"
permissions = []
hoist = false
mentionable = false
colour = 0

# categories

[[categories]]
name = "Start here"
  [[categories.overwrites]]
  target = "@everyone"
  deny = ["@read_only", "add_reactions"]
  [[categories.overwrites]]
  target = "@bot"
  allow = ["@bot_write"]

[[categories]]
name = "Resources"
  [[categories.overwrites]]
  target = "@everyone"
  deny = ["@read_only", "add_reactions"]
  [[categories.overwrites]]
  target = "@bot"
  allow = ["@bot_write"]

[[categories]]
name = "Community"

[[categories]]
name = "Support"

[[categories]]
name = "Contributing"

[[categories]]
name = "Staff"
# the access check fails the build if anyone but staff and the bot could see a channel here
staff = true
  [[categories.overwrites]]
  target = "@everyone"
  deny = ["view_channel"]
  [[categories.overwrites]]
  target = "Maintainer"
  allow = ["view_channel"]
  [[categories.overwrites]]
  target = "Moderator"
  allow = ["view_channel"]
  [[categories.overwrites]]
  target = "@bot"
  allow = ["@bot_write"]

# channels

[[channels]]
name = "welcome"
category = "Start here"
type = "text"
topic = "Discord says hello here each time someone joins PHAEMOS. Nobody writes in this channel, so it stays a plain list of arrivals."
  [[channels.overwrites]]
  target = "@everyone"
  deny = ["@read_only"]
  allow = ["add_reactions"]

[[channels]]
name = "rules"
category = "Start here"
type = "text"
style = "plain"
pin = true
topic = "The rules everyone here agrees to. Short on purpose."
messages = ["texts/rules-1.md", "texts/rules-2.md"]

[[channels]]
name = "start-here"
category = "Start here"
type = "text"
style = "embed"
banner = true
pin = true
topic = "What this server is for, where to ask what and how to reach us."
messages = ["texts/start-1.md", "texts/start-2.md", "texts/start-3.md"]

[[channels]]
name = "announcements"
category = "Start here"
type = "announcement"
topic = "Project news from the maintainers. Each post links to the full text on GitHub."
  [[channels.overwrites]]
  target = "@everyone"
  deny = ["@read_only"]
  [[channels.overwrites]]
  target = "Maintainer"
  allow = ["send_messages"]

[[channels]]
name = "releases"
category = "Start here"
type = "announcement"
topic = "Every new PHAEMOS release with its notes. Set this channel to all messages to hear about each one."
  [[channels.overwrites]]
  target = "@everyone"
  deny = ["@read_only"]

[[channels]]
name = "service-status"
category = "Start here"
type = "announcement"
topic = "Incidents and planned maintenance for the hosted PHAEMOS service."
  [[channels.overwrites]]
  target = "@everyone"
  deny = ["@read_only"]

[[channels]]
name = "docs"
category = "Resources"
type = "text"
topic = "Links people look up again and again: the documentation, the FAQ, the roadmap and how to contribute."
messages = ["texts/docs-1.md"]
style = "embed"
pin = true

[[channels]]
name = "general"
category = "Community"
type = "text"
slow_mode = 5
topic = "Talk about PHAEMOS and machine monitoring. A question that needs an answer goes in help."

[[channels]]
name = "bot-commands"
category = "Community"
type = "text"
slow_mode = 5
style = "plain"
pin = true
topic = "Try the PHAEMOS slash commands here. Type / and pick one. The pinned message lists them all."
messages = ["texts/bot-commands.md"]
  [[channels.overwrites]]
  target = "@everyone"
  allow = ["use_application_commands"]

[[channels]]
name = "ideas"
category = "Community"
type = "forum"
topic_file = "texts/guidelines-ideas.md"
read_first = "texts/readfirst-ideas.md"
  [channels.forum]
  require_tag = true
  default_sort = "creation_date"
  layout = "list"
  post_slow_mode = 300
  reply_slow_mode = 0
  auto_archive_minutes = 10080
  tags = [
    { name = "Read first", moderated = true }, { name = "From GitHub" }, { name = "Feature" }, { name = "Improvement" },
    { name = "Integration" }, { name = "Hardware" }, { name = "Docs" },
    { name = "Other" }, { name = "Planned", moderated = true }, { name = "Not planned", moderated = true },
    { name = "Done", moderated = true },
  ]

[[channels]]
name = "research"
category = "Community"
type = "forum"
topic_file = "texts/guidelines-research.md"
read_first = "texts/readfirst-research.md"
  [channels.forum]
  require_tag = true
  default_sort = "creation_date"
  layout = "list"
  post_slow_mode = 300
  reply_slow_mode = 0
  auto_archive_minutes = 10080
  tags = [
    { name = "Read first", moderated = true }, { name = "From GitHub" }, { name = "Anomaly detection" }, { name = "Sensors" },
    { name = "Data" }, { name = "Standards" }, { name = "Papers" },
    { name = "Other" },
  ]

