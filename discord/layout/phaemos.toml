  [[channels.overwrites]]
  target = "Moderator"
  allow = ["connect", "manage_channels", "mute_members", "move_members"]

# auto moderation

[[automod]]
name = "Spam"
trigger = "spam"
actions = [{ type = "block" }, { type = "alert", channel = "mod-log" }]

[[automod]]
name = "Mention raid"
trigger = "mention_spam"
mention_total_limit = 5
mention_raid_protection = true
actions = [{ type = "block" }, { type = "alert", channel = "mod-log" }, { type = "timeout", seconds = 600 }]
exempt_roles = ["Maintainer", "Moderator"]

[[automod]]
name = "Slurs and sexual content"
trigger = "keyword_preset"
presets = ["slurs", "sexual_content"]
actions = [
  { type = "block", message = "We blocked this message because it contains words our rules do not allow. Please rephrase it." },
  { type = "alert", channel = "mod-log" },
]

[[automod]]
name = "Invite links"
trigger = "keyword"
patterns = ['(?i)discord(?:app)?\.com/invite/[a-z0-9-]+', '(?i)discord\.gg/[a-z0-9-]+']
actions = [
  { type = "block", message = "We do not allow invites to other servers here. Ask a maintainer if you think yours belongs." },
  { type = "alert", channel = "mod-log" },
]
exempt_roles = ["Maintainer", "Moderator"]

[[automod]]
name = "Short and masked links"
trigger = "keyword"
keywords = ["*bit.ly/*", "*tinyurl.com/*", "*is.gd/*", "*cutt.ly/*", "*rb.gy/*", "*shorturl.at/*", "*t.ly/*"]
patterns = ['\[[^\]]*https?://[^\]]*\]\(\s*<?https?://']
actions = [
  { type = "block", message = "Please post the full address. We block shortened and disguised links." },
  { type = "alert", channel = "mod-log" },
]
exempt_roles = ["Maintainer", "Moderator", "Contributor"]

[[automod]]
name = "Scam phrases"
trigger = "keyword"
keywords = ["*free nitro*", "*nitro for free*", "*steam gift*", "*crypto giveaway*", "*claim your prize*", "*airdrop*"]
actions = [{ type = "block" }, { type = "alert", channel = "mod-log" }, { type = "timeout", seconds = 3600 }]
exempt_roles = ["Maintainer", "Moderator"]

[[automod]]
name = "Secrets"
trigger = "keyword"
patterns_file = "texts/secret-patterns.txt"
actions = [
  { type = "block", message = "This looks like a key or a token, so we blocked it. Replace the secret, then post again without it." },
]

[[automod]]
name = "Security words"
trigger = "keyword"
keywords = [
  "vulnerability", "vulnerabilities", "exploit*", "0day", "zero-day", "CVE-*", "*sql injection*",
  "*remote code execution*", "*authentication bypass*", "*privilege escalation*", "proof of concept",
]
actions = [{ type = "alert", channel = "mod-log" }]
exempt_roles = ["Maintainer", "Moderator"]

[[automod]]
name = "Impersonation"
trigger = "member_profile"
keywords = [
  "moderator", "maintainer", "*phaemos support*", "*phaemos team*", "*phaemos staff*",
  "*phaemos admin*", "*phaemos official*", "*phaemos help*",
]
# alert only: a name that holds "maintainer" or "moderator" is a reason to look and not to block
actions = [{ type = "alert", channel = "mod-log" }]
exempt_roles = ["Maintainer", "Moderator"]

# onboarding

[onboarding]
enabled = true
mode = "default"
default_channels = [
  "rules", "start-here", "docs", "bot-commands", "announcements", "releases", "general", "introductions", "off-topic", "showcase", "help", "hardware", "contributing",
]

[[onboarding.prompts]]
title = "What brings you here?"
type = "multiple_choice"
single_select = false
required = false
in_onboarding = true
  [[onboarding.prompts.options]]
  title = "I run or want to run PHAEMOS"
  description = "Help with installing, running and reading the dashboard"
  roles = ["Operator"]
  channels = ["help"]
  [[onboarding.prompts.options]]
  title = "I am building the sensor nodes"
  description = "Boards, wiring, sensors and enclosures"
  roles = ["Hardware builder"]
  channels = ["hardware"]
  [[onboarding.prompts.options]]
  title = "I want to contribute"
  description = "Code, boards or documentation"
  roles = ["Developer"]
  channels = ["contributing", "ideas", "research", "github-feed"]
  [[onboarding.prompts.options]]
  title = "I am just looking around"
  description = "See what people have built"
  roles = []
  channels = ["showcase"]

# webhooks: the address is never written here, only the name of the secret that will hold it

[[webhooks]]
name = "PHAEMOS announcements"
channel = "announcements"
secret = "DISCORD_WEBHOOK_ANNOUNCEMENTS"
store = "github"

[[webhooks]]
name = "PHAEMOS releases"
channel = "releases"
secret = "DISCORD_WEBHOOK_RELEASES"
store = "github"

[[webhooks]]
name = "PHAEMOS on GitHub"
channel = "github-feed"
secret = "DISCORD_WEBHOOK_FEED"
store = "github"

[[webhooks]]
name = "Reports"
channel = "mod-log"
secret = "REPORTS_WEBHOOK_URL"
store = "cloudflare"

[[webhooks]]
name = "PHAEMOS ideas"
channel = "ideas"
secret = "DISCORD_WEBHOOK_IDEAS"
store = "github"

[[webhooks]]
name = "PHAEMOS research"
channel = "research"
secret = "DISCORD_WEBHOOK_RESEARCH"
store = "github"

[[webhooks]]
name = "Tickets"
channel = "tickets"
secret = "TICKETS_WEBHOOK_URL"
store = "cloudflare"

[[webhooks]]
name = "PHAEMOS CI alerts"
channel = "ci-alerts"
secret = "DISCORD_WEBHOOK_CI_ALERTS"
store = "github"

# commands and relay

[commands]
content = "content/commands.toml"
# commands the tool registered earlier and no longer wants. The next apply removes them. Never a name a person made
retired = ["bug"]

[status]
enabled = true
url = "https://api.phaemos.com/status"
page = "https://status.phaemos.com"

[relay]
repository = "phaemos/phaemos"
project = "PHAEMOS"
colour = 2450411
commit_types = ["feat", "fix", "perf", "docs", "revert"]
skip_labels = ["automated"]
# hosts that a link in a post body may keep. Every other host is shown as plain text
link_hosts = ["phaemos.com", "www.phaemos.com", "docs.phaemos.com", "status.phaemos.com"]
labels = [
  "bug", "enhancement", "documentation", "good first issue", "help wanted", "accessibility", "security",
  "performance", "hardware", "firmware", "pcb", "enclosure", "backend", "frontend", "client", "infra", "edge",
]

[relay.discussions]
announcements = { webhook = "PHAEMOS announcements", form = "announcement" }
"q-a" = { webhook = "PHAEMOS on GitHub", lead = "New question in Q&A" }
ideas = { webhook = "PHAEMOS ideas", lead = "New idea in Ideas", thread = true, tag = "From GitHub", tag_secret = "DISCORD_TAG_IDEAS" }
"show-and-tell" = { webhook = "PHAEMOS on GitHub", lead = "New build shared in Show and tell" }
research = { webhook = "PHAEMOS research", lead = "New research note in Research", thread = true, tag = "From GitHub", tag_secret = "DISCORD_TAG_RESEARCH" }
polls = { webhook = "PHAEMOS on GitHub", lead = "New poll in Polls" }
