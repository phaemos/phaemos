site_name: PHAEMOS
site_description: Industrial IoT predictive maintenance platform - documentation
site_url: https://docs.phaemos.com
repo_url: https://github.com/phaemos/phaemos
repo_name: phaemos/phaemos
edit_uri: edit/main/docs/

theme:
  name: material
  # no font host: Exo 2, Manrope and IBM Plex Mono are served from docs/assets/fonts (see NOTICE.txt there)
  font: false
  custom_dir: docs/overrides
  logo: assets/icons/emblem-light.png
  favicon: assets/icons/emblem-light.png
  language: en
  palette:
    # both themes follow the reader's system setting at first. The switch in the header then keeps their choice.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/phaemos.css

extra_javascript:
  - assets/js/phaemos.js

# adds a scroll box and a label to every table so a wide one scrolls inside itself, with or without script
hooks:
  - docs/overrides/hooks.py

extra:
  # the theme's own credit line is left out of the footer
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phaemos/phaemos
      name: Phaemos on GitHub

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started:
    - Architecture: architecture.md
    - Development: development.md
    - Deployment: deployment.md
    - Deployment Checklist: deployment-checklist.md
    - Scalability: scalability.md
  - Reference:
    - API Reference: api-reference.md
    - API Conventions: api-conventions.md
    - API Stability: api-stability.md
    - Sensor Reference: sensor_reference.md
    - Database Schema: schema.md
    - Tech Stack: tech-stack.md
    - Repositories: repositories.md
  - Security: security.md
  - Development:
    - Decision Log: decisions.md
    - Releases: releases.md
    - Week by Week: week_by_week.md
    - Verification: VERIFICATION.md
  - Monitoring: instatus.md

exclude_docs: |
  README.md
  overrides/

markdown_extensions:
  - admonition
  - pymdownx.details
  # a diagram is written into the page as text and drawn by the vendored library in assets/vendor (the theme's own diagram
  # support would fetch the library from a third party host and this site makes no request to any other origin)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: ph-diagram
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
