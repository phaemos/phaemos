[package]
name = "phaemos-edge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "PHAEMOS edge gateway: spools sensor readings to disk and forwards them to the API, surviving network outages"
license = "AGPL-3.0-or-later"
repository = "https://github.com/phaemos/phaemos"
readme = "README.md"

[dependencies]
serde_json = "1.0.151"
ureq = "3.4.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
