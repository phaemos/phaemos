; PlatformIO project for the vibration node (STM32F411CEU6 Black Pill).
; sources stay in Core/Src and Core/Inc so the folder layout is unchanged.

[platformio]
src_dir     = Core/Src
include_dir = Core/Inc

[env:blackpill_f411ce]
platform  = ststm32@20.0.0
board     = blackpill_f411ce
framework = stm32cube

; flash and debug through an ST-Link on the SWD header
upload_protocol = stlink
debug_tool      = stlink

; use Core/Inc/stm32f4xx_hal_conf.h instead of the framework's copied template
board_build.stm32cube.custom_config_header = yes

; HSE_VALUE matches the 25 MHz crystal on the Black Pill.
; FFT_USE_CMSIS_DSP=0 selects the self-contained radix-2 FFT in fft.c.
; -mfloat-abi=softfp uses the FPU instructions but keeps the soft-float
; calling convention, so the objects link against the default libraries
; without any extra script.  hard-float would also need the hard ABI on the
; link line, which PlatformIO only takes from an extra script that appends to
; LINKFLAGS.  the CMSIS-DSP option (-DFFT_USE_CMSIS_DSP=1) uses the hard-float
; library arm_cortexM4lf_math, so it would need that script as well.
; -Wl,-u,_printf_float is routed to the linker by the build system and pulls
; float support into newlib-nano for the "%.2f" telemetry line.
build_flags =
    -DHSE_VALUE=25000000U
    -DFFT_USE_CMSIS_DSP=0
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp
    -Wl,-u,_printf_float
