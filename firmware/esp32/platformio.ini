; PHAEMOS ESP32 hub - PlatformIO build.
; the sketch files stay in this folder. pio_src/main.cpp includes ota.ino and
; esp32.ino into one translation unit.
;
; two environments, one per carrier board:
;   esp32dev       the board that exists today. this is the default environment.
;   esp32dev_revb  the REVISED carrier board. it is not built yet and none of this firmware
;                  has run on it. do not flash it to a present board: it would switch the
;                  serial receive pull-ups off where there are no pull-downs and treat GPIO14
;                  as the sensor supply switch instead of relay 3.
; the HAS_ switches in config.h say what each board has. they can be set here because config.h
; only gives them a default when the build has not.
[platformio]
src_dir = pio_src
default_envs = esp32dev

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200

; the modules sit beside the sketch files rather than inside src_dir.
build_src_filter =
    +<*>
    +<../sensors/>
    +<../outputs/>
    +<../comms/>

lib_ldf_mode = chain+
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit BusIO@1.16.1
    adafruit/Adafruit Unified Sensor@1.1.14
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit SSD1306@2.5.10
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit MPU6050@2.2.6
    adafruit/Adafruit INA219@1.2.3
    adafruit/Adafruit_VL53L0X@1.2.4
    adafruit/Adafruit MLX90614 Library@2.1.5
    adafruit/Adafruit NeoPixel@1.15.5
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.9.1

[env:esp32dev]
; the present board: no 12 V divider, no sensor supply switch (GPIO14 is relay 3), no
; pull-downs on the serial receive lines and no 0 V on an unplugged microphone or probe.
build_flags =
    -DHAS_NANO=1
    -DHAS_STM32=1
    -DHAS_FC28=1
    -DHAS_INPUT_MONITOR=0
    -DHAS_SENSOR_RAIL_SWITCH=0
    -DHAS_INPUT_PULLDOWNS=0
    -DHAS_PROBE_SERIES_R=0

[env:esp32dev_revb]
; the revised board: 12 V divider on GPIO39, sensor supply switch on GPIO14, relay 3 on
; GPIO23, 100 kohm pull-downs on both serial receive lines and a 2.2 kohm resistor in the
; moisture probe's lead. it also carries the MCP23017 port expander, so its driver is built in.
build_flags =
    -DHAS_NANO=1
    -DHAS_STM32=1
    -DHAS_FC28=1
    -DHAS_INPUT_MONITOR=1
    -DHAS_SENSOR_RAIL_SWITCH=1
    -DHAS_INPUT_PULLDOWNS=1
    -DHAS_PROBE_SERIES_R=1
    -DHAS_EXPANDER=1

; release builds. the same boards with PHAEMOS_RELEASE set, which makes the build fail with a
; clear message until real trust roots are pasted into comms/trust_roots.h and refuses
; ALLOW_PLAIN_HTTP. build the image for a real hub with one of these. they are not part of
; `make firmware-check`, which builds the two environments above and needs no certificate.
[env:esp32dev_release]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DPHAEMOS_RELEASE=1

[env:esp32dev_revb_release]
extends = env:esp32dev_revb
build_flags =
    ${env:esp32dev_revb.build_flags}
    -DPHAEMOS_RELEASE=1
