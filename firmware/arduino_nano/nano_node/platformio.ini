; build settings for the Nano node.  the sketch sits beside this file so
; src_dir points at the folder itself and nothing has to move.
[platformio]
src_dir = .
default_envs = nanoatmega328

[env]
platform = atmelavr@5.3.0
framework = arduino
monitor_speed = 9600
; no external libraries: the BME280 and BMP280 are read by a small driver in
; sensors.cpp.  Wire ships with the Arduino core.
lib_deps =
build_flags = -Wall

; new bootloader (115200 baud upload)
[env:nanoatmega328new]
board = nanoatmega328new

; old bootloader (57600 baud upload) found on many clones
[env:nanoatmega328]
board = nanoatmega328

; same code as nanoatmega328new with the watchdog on.  keep this for the new bootloader only:
; the older one does not switch the watchdog off after a watchdog reset, so a board that
; resets once then resets for ever until it is power-cycled.  see ../README.md.
[env:nanoatmega328new_wdt]
board = nanoatmega328new
build_flags = ${env.build_flags} -DNANO_WATCHDOG

; calibrated supply: SUPPLY_RANGE limits are 4500 and 5500 mV.  set BANDGAP_MV_NOMINAL first.
; the emulation builds this one too.
[env:nanoatmega328new_cal]
board = nanoatmega328new
build_flags = ${env.build_flags} -DBANDGAP_CALIBRATED=1
