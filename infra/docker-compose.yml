# development only: never run this file in production. It hard-codes development
# values that override backend/.env. Production uses infra/docker-compose.prod.yml.
#
# full PHAEMOS stack. From the repository root the root docker-compose.yml includes
# this file, so `docker compose up` keeps working there.

name: phaemos

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: phaemos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    # every port listens on localhost only. Docker's published ports bypass a host
    # firewall, so binding to all interfaces would expose them to the internet.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'

  backend:
    build:
      context: ../backend
      args:
        # the test and plotting packages, which the production image leaves out
        REQUIREMENTS: requirements-dev.txt
    # the source is bind mounted and written to by the host's own user (test cache, firmware and model files), so
    # development runs as root. Production runs the same image as an unprivileged user
    user: '0:0'
    # a production backend/.env (one with the limited database login, the Redis password or the
    # backup key filled in) is bind mounted here with the source and the API would read its
    # secrets while running as a development stack. That is what typing `docker compose up` on
    # the droplet would do, so this stack refuses to start next to such a file
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /app/.env ] && grep -qE '^(POSTGRES_APP_PASSWORD|REDIS_PASSWORD|BACKUP_AGE_RECIPIENT)=.' /app/.env; then
          echo 'refusing to start: backend/.env looks like a production file. This is the development stack. Use infra/docker-compose.prod.yml (infra/scripts/deploy.sh).' >&2
          exit 1
        fi
        exec "$$@"
      - --
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    # SECRET_KEY comes from infra/.env.dev, which `make dev` creates with a random value the
    # first time and reuses after that. No signing key is written in this file: a key in a
    # public repository works on every stack that ever used it. Without the file the API
    # refuses to start (it refuses an empty key), so run `make dev-key` once.
    env_file:
      - path: .env.dev
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/phaemos
      REDIS_URL: redis://redis:6379
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ALLOWED_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
    depends_on:
      - db
      - redis
    volumes:
      - ../backend:/app

  frontend:
    # the context is the repository root so the image can read CHANGELOG.md. See frontend/Dockerfile.
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # the image refuses a build without an https API address unless the insecure flag is
        # passed. This file is for development on localhost, so it passes both. Production
        # never passes ALLOW_INSECURE_API_URL.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        ALLOW_INSECURE_API_URL: "1"
        # this file is for development, so a legal page with an open placeholder does not stop the build. A production image is
        # built without this value and stops (see frontend/README.md). Set LEGAL_PLACEHOLDERS=fail here to see that.
        LEGAL_PLACEHOLDERS: ${LEGAL_PLACEHOLDERS:-allow}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
