# Nginx site for the API. Install it as /etc/nginx/sites-available/api.phaemos.com.conf
# and link it into sites-enabled (docs/deployment.md, Section 9).
#
# this file is complete: the TLS listener, the certificate paths, the redirect, HSTS and the
# refusal of unknown host names are all written here. Certbot is used to ISSUE and RENEW the
# certificate only (`certbot certonly --webroot`), so it never edits this file and its edits
# and ours cannot fight. The certificate paths below are the ones Certbot writes. Issue the
# certificate BEFORE installing this file, because Nginx refuses to load a site whose
# certificate is missing. The stock Nginx site that install.sh leaves in place answers the
# challenge for the first issue. After that the challenge location below answers it.
#
# infra/scripts/check-nginx.sh reads the running configuration and fails if any limit or
# header below is gone and deploy.sh runs it.

# the origins a browser page may read an error from. Nginx answers some errors itself (429, 413,
# 502 and 504) and a browser hides any answer without CORS headers from the page that asked,
# so the page sees only "network error". This file is GENERATED from the same two settings the
# API reads, ALLOWED_ORIGINS and CREDENTIALED_ORIGINS in backend/.env, by
# infra/scripts/render-cors.sh, so there is one place to change an origin. It holds exact
# origins and never a wildcard. check-nginx.sh fails when it no longer matches backend/.env.
include /etc/nginx/phaemos-cors-origins.conf;

# upgrade a connection only when the client asks for it. Ordinary requests keep a
# normal connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# no listener is opened on IPv6 (there is no `listen [::]` line): Nginx would count one visitor
# by the whole IPv6 address, which one /64 of addresses gives away by the million, while the
# API counts it by /64. Until IPv6 is wanted there is no AAAA record and no listener. To
# add it, key the zones on the /64 first.
#
# connections held open by one client address. One zone for the live sockets and one for the API as
# a whole. $binary_remote_addr is the client's real address because Nginx faces the internet.
limit_conn_zone $binary_remote_addr zone=ws_per_addr:10m;
limit_conn_zone $binary_remote_addr zone=api_per_addr:10m;
# every live socket on the server, all addresses together. The API (uvicorn) takes 150 open
# connections and requests and answers 503 beyond that. A socket that sends nothing is closed
# by the app after 5 seconds, but twenty from each of eight addresses would still hold 150.
# A cap of 60 sockets in all leaves 90 for ordinary requests whatever the attackers'
# addresses and is more than a dashboard fleet needs.
limit_conn_zone $server_name zone=ws_total:1m;
limit_conn_status 429;

# requests per address, in three classes. $uri is the path after Nginx has decoded it and
# merged repeated slashes, so an encoded or doubled slash cannot slip into the wrong class.
# A request that is not in a class gets an empty key for that class's zone and Nginx does
# not count a request with an empty key. So one `location /` can carry all three limits and
# each request is counted in exactly one zone.
#
# the TIGHT class (auth) is exactly the routes a stranger can use to guess or flood and
# nothing a signed-in person does. Account administration (the user list, invitations,
# service accounts, tokens, a person's own profile and sessions) is behind a login and falls
# in the general class: a page of the dashboard asks for several of them at once. The list,
# with the reason for each, in the order of the regular expressions below:
#   /api/v1/auth/login, register, refresh     guessing a password, opening accounts, replaying a cookie
#   /api/v1/auth/2fa/verify                   guessing the second step
#   /api/v1/auth/accept-invite, invite/check  guessing an invitation token
#   /api/v1/auth/reset-password               guessing a reset token
#   /api/v1/auth/google, github, microsoft, apple (and /callback)
#                                             starting and finishing a provider sign-in, which makes
#                                             the server call the provider
#   /api/v1/contact                           mails the operator, so it is the easiest thing to flood
# The old /api/v1/auth/users, /invite, /tokens and the rest of the deprecated aliases for
# the administration routes are NOT listed, so they are general like their new homes
# (/api/v1/users, /invitations, /service-accounts, /tokens).
# the INGEST class is the single reading and the batch route. A trailing slash is the same route.
map $uri $phaemos_class {
    default                                                                          api;
    ~^/api/v1/auth/(login|register|refresh|accept-invite|reset-password)/?$          auth;
    ~^/api/v1/auth/(2fa/verify|invite/check)/?$                                      auth;
    ~^/api/v1/auth/(google|github|microsoft|apple)(/callback)?/?$                    auth;
    ~^/api/v1/contact/?$                                                             auth;
    ~^/api/v1/telemetry(/batch)?/?$                                                  ingest;
}
map $phaemos_class $phaemos_key_api    { api    $binary_remote_addr; default ''; }
map $phaemos_class $phaemos_key_auth   { auth   $binary_remote_addr; default ''; }
map $phaemos_class $phaemos_key_ingest { ingest $binary_remote_addr; default ''; }

# the tight class above: 30 a minute an address, which is one every two seconds. A person signing in, passing the second step and loading the
# dashboard makes about five of these, so an office of ten people signing in together fits
# inside the burst below. A password guesser is held to 30 a minute an address and the
# API's own account lock still applies on top. The zone holds about 160,000 addresses.
limit_req_zone $phaemos_key_auth zone=phaemos_auth:10m rate=30r/m;

# telemetry ingest. The arithmetic: about fifty nodes behind one shared address, each
# posting every 3 to 5 seconds, is 50 / 3 = 16.7 requests a second at the worst and 50 / 5
# = 10 a second typically. 30 a second is a little under twice the worst case, which covers
# nodes that drift into step and a few retries. One address cannot push more than 30 a
# second at the API and the API still checks the key on each one.
limit_req_zone $phaemos_key_ingest zone=phaemos_ingest:10m rate=30r/s;
# a batch is ONE request, whatever it carries. The app allows a device 1,200 readings a minute
# and the whole site 6,000 and a batch holds up to 100 readings, so the busiest legitimate
# use is 12 batches a minute from one device and 60 from the site, a gateway draining a
# backlog included. That is 1 request a second, far inside 30 a second with a burst of 60.
# The zone is not what limits a gateway: the app's own allowance is.

# everything else: the dashboard's reads, a burst of a dozen at page load and the rest.
# 20 a second is well past what a person generates. A second dashboard behind the same
# address still fits.
limit_req_zone $phaemos_key_api zone=phaemos_api:10m rate=20r/s;

# opening a live socket: 5 a second an address with a burst of 20. A dashboard opens one
# per machine on a page, so a page of twenty machines fits in the burst. This limits the
# upgrade requests themselves and is separate from the cap on sockets held open
limit_req_zone $binary_remote_addr zone=phaemos_ws:10m rate=5r/s;

# these zones and the connection limits below count REQUESTS and CONCURRENT connections, not
# TLS handshakes. A hub that opens a new connection for every post and closes it after the
# response holds one connection for a fraction of a second, so it never comes near the
# connection limits and each post is one request in the ingest zone however it arrived.
# a limited request is answered 429, which clients and the nodes' firmware already
# understand as "slow down". The default would be 503, which looks like an outage.
limit_req_status 429;
limit_req_log_level warn;

# requests that name any other host or only the address get no answer. Only the API's own
# name reaches the app, which keeps scanners and stray DNS records away from it.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    # the header timer is read from the server that is chosen before the Host header has
    # arrived, which is the default server, so these must be set here and not only below
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 10s;
    return 444;
}

# the same for TLS: a handshake for any name other than the API's own is refused before a
# certificate is sent, so the certificate is not shown to a scanner either. This block needs
# no certificate of its own.
server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    # the header timer is read from the server that is chosen before the Host header has
    # arrived, which is the default server, so these must be set here and not only below
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 10s;
    ssl_reject_handshake on;
    # a client that names the right host in the handshake and a wrong one in the request
    # lands here after the handshake. It gets nothing, not a 404 page without the headers
    return 444;
}

# plain HTTP: the certificate challenge and a redirect to HTTPS, nothing else
server {
    listen 80;
    server_name api.phaemos.com;
    server_tokens off;

    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 10s;

    # Certbot's webroot challenge. The folder is the stock Nginx one, which is where the
    # first certificate is issued from. A renewal repeats the same path.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://api.phaemos.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.phaemos.com;

    # the certificate Certbot writes for this name. Do not point it anywhere else
    ssl_certificate     /etc/letsencrypt/live/api.phaemos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phaemos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 suites: forward secret and authenticated encryption only, so no CBC suite and
    # no SHA-1. The hub's TLS library (mbedTLS in the ESP32 core) has ECDHE with RSA and with
    # ECDSA, AES-GCM, the P-256 curve and TLS 1.2 compiled in (CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA,
    # _ECDSA, GCM_C and SSL_PROTO_TLS1_2 in the core's sdkconfig), so the AES-GCM suites below
    # are the ones it can use. ChaCha20 is for phones and browsers. TLS 1.3 suites are not set
    # here because they are all authenticated encryption already
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # session resumption. A hub posts every 5 seconds over a new TLS connection that it closes
    # after each post, so every post would otherwise pay for a full handshake. With the shared
    # cache and tickets on, the next connection resumes the last session and skips the
    # expensive key exchange (checked against this file on Nginx 1.24: TLS 1.2 and 1.3 both
    # resumed. With tickets off neither did). The cost of tickets is that one key opens every
    # ticket it issued, so that key must not live long. Nginx makes a new random ticket key at
    # every reload, install.sh adds a weekly reload for that and a ticket is valid for 10
    # minutes whatever the key's age.
    ssl_session_cache shared:phaemos_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_prefer_server_ciphers off;

    # HSTS: browsers will use HTTPS only for this name for a year. It is on every answer,
    # errors included (`always`). It is set at server level and no ordinary location below sets any
    # add_header, because a location that sets one drops every header set above it (the four
    # named error answers do set them and so repeat the whole list).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # the API returns JSON and never a page, so no browser should guess a type for it
    add_header X-Content-Type-Options "nosniff" always;
    # token replies and every other answer must not sit in a browser or proxy cache. The
    # upstream's own Cache-Control is hidden below so the answer carries exactly one.
    add_header Cache-Control "no-store" always;

    # the upstream's own Server and framework headers say what runs behind Nginx. They are
    # hidden here. Nginx adds its own Server header, which carries no version because of
    # server_tokens. A copy of the two headers above from the app would be sent twice, so
    # the app's copies are hidden too.
    server_tokens off;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Cache-Control;
    # the API builds a redirect (for example for a path with a trailing slash) from the request
    # it saw, which reached it over plain HTTP from Nginx, so it names http://. A client that
    # follows that would send its key in clear on port 80. Every redirect that names this
    # host is rewritten to https
    proxy_redirect http://api.phaemos.com/ https://api.phaemos.com/;

    # Nginx's own answers use the API's one error shape, {"code", "detail", "request_id"}, with a
    # stable code, so a client handles them with the code that handles the API's. Only an error
    # that Nginx makes itself reaches these: an error the API sends (its own 429 or 413, a 503
    # from its concurrency limit) passes through untouched because proxy_intercept_errors is off.
    error_page 429 @rate_limited;
    error_page 413 @payload_too_large;
    error_page 502 @upstream_unavailable;
    error_page 504 @upstream_timeout;

    # every request body: 64 kB. The largest legitimate JSON body is a batch of readings or
    # a webhook definition, far below that. The firmware upload has its own location with
    # a larger limit. A request over the limit is answered 413 before the app sees it.
    client_max_body_size 64k;

    # slow clients (the same timers are on the two default servers above, because Nginx
    # reads the header timer before it knows which name the client asked for). The header
    # timer bounds the time for the whole header. The body timer is different: it restarts
    # at every read, so it bounds a STALL and not a whole upload and a client that sends one
    # byte every few seconds keeps its connection open for as long as it likes (up to the
    # 64 kB body, so for days). Nothing in Nginx caps the total body time. What contains it:
    # `limit_conn api_per_addr` holds one address to 100 such connections, the body is held in
    # Nginx and never reaches the API until it is whole (so a slow body does not use one of
    # the API's 150 slots) and install.sh raises worker_connections
    client_header_timeout 10s;
    client_body_timeout 10s;
    # a client that stops reading its answer for this long is dropped
    send_timeout 15s;
    # a node posts every few seconds, so 30 seconds keeps its connection and a silent
    # connection does not stay for ever
    keepalive_timeout 30s;
    # a request line or header larger than this is refused with 400 or 414
    large_client_header_buffers 4 8k;
    # free the socket at once for a connection that timed out, instead of waiting for FIN
    reset_timedout_connection on;

    # the four named answers. Each repeats the security headers and the CORS headers, because a
    # location that sets any add_header drops every header set at server level. The CORS headers
    # come from the generated map at the top of the file: an origin that is not listed gets an
    # empty value and Nginx then sends no header, so there is never a wildcard. Credentials are
    # allowed only for the origins the API gives credentials to. $request_id is Nginx's own id.
    # Retry-After is 2 seconds: the slowest zone (sign-in, one request every two seconds) has a
    # token again after 2 seconds and a faster zone only needs less. A refused connection
    # (limit_conn) clears as soon as a connection closes, so 2 seconds is safe there too.
    location @rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $phaemos_cors_origin always;
        add_header Access-Control-Allow-Credentials $phaemos_cors_credentials always;
        add_header Access-Control-Expose-Headers $phaemos_cors_expose always;
        add_header Vary "Origin" always;
        add_header X-Request-ID $request_id always;
        add_header Retry-After "2" always;
        return 429 '{"code":"rate_limited","detail":"Too many requests. Wait a moment and try again.","request_id":"$request_id"}';
    }

    location @payload_too_large {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $phaemos_cors_origin always;
        add_header Access-Control-Allow-Credentials $phaemos_cors_credentials always;
        add_header Access-Control-Expose-Headers $phaemos_cors_expose always;
        add_header Vary "Origin" always;
        add_header X-Request-ID $request_id always;
        return 413 '{"code":"payload_too_large","detail":"The request body is larger than this route accepts.","request_id":"$request_id"}';
    }

    location @upstream_unavailable {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $phaemos_cors_origin always;
        add_header Access-Control-Allow-Credentials $phaemos_cors_credentials always;
        add_header Access-Control-Expose-Headers $phaemos_cors_expose always;
        add_header Vary "Origin" always;
        add_header X-Request-ID $request_id always;
        return 502 '{"code":"upstream_unavailable","detail":"The service is not reachable. Try again shortly.","request_id":"$request_id"}';
    }

    location @upstream_timeout {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $phaemos_cors_origin always;
        add_header Access-Control-Allow-Credentials $phaemos_cors_credentials always;
        add_header Access-Control-Expose-Headers $phaemos_cors_expose always;
        add_header Vary "Origin" always;
        add_header X-Request-ID $request_id always;
        return 504 '{"code":"upstream_timeout","detail":"The service took too long to answer. Try again shortly.","request_id":"$request_id"}';
    }

    # live telemetry sockets at /ws/telemetry/{device_id}. A socket can sit idle between
    # readings, so the read timeout is long. The default of 60 seconds would cut it.
    location /ws/ {
        # 10 live sockets an address. A site with a few dashboards open behind one shared address
        # still fits and one client cannot hold hundreds. The app caps sockets per account too.
        limit_conn ws_per_addr 10;
        # all addresses together (see the zone at the top of the file)
        limit_conn ws_total 60;
        # opening sockets fast is limited as a request rate too. Before this nothing counted them
        limit_req zone=phaemos_ws burst=20 nodelay;
        # the socket address carries the access token in its query string, so it must
        # never reach the access log
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # push frames straight through instead of holding them in a buffer
        proxy_buffering off;
    }

    # request counts and timings are for monitoring inside the Docker network. The public
    # site has no use for them.
    location = /metrics {
        return 404;
    }

    # the batch ingest route: up to 100 readings in one request, at most about 550 kB. 600000
    # bytes is the API's own limit (BATCH_MAX_BODY_BYTES), so a body the API would take is never
    # stopped here and one it would refuse is stopped before it is read. It is this one exact
    # route: every other route, the single-reading route included, keeps the 64 kB limit. It is
    # counted in the ingest class. A 550 kB body over a slow link takes longer than 10 seconds
    # between reads on a bad day, so the body timer is longer here
    location = /api/v1/telemetry/batch {
        client_max_body_size 600000;
        client_body_timeout 30s;
        limit_req zone=phaemos_ingest burst=60 nodelay;
        limit_conn api_per_addr 100;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # the firmware upload, the one other place a large body is legitimate. The API refuses a file
    # above 2 MB. 3m lets the API answer its own clear 413 for a file just over the limit
    # while Nginx still stops anything much larger before it reaches the app. The body
    # timer is longer because a 2 MB file over a slow link takes longer than 10 seconds.
    location = /api/v1/firmware/upload {
        client_max_body_size 3m;
        client_body_timeout 60s;
        limit_req zone=phaemos_api burst=10 nodelay;
        limit_conn api_per_addr 100;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # everything else. CORS headers are left to the API, which answers for the dashboard
    # origin. Adding them here as well would send each header twice and browsers reject that.
    location / {
        # the three limits. Each request is counted in one zone only (see the maps at the
        # top of this file). `nodelay` serves a request that is inside the burst at once
        # and refuses the rest with 429, so a legitimate spike is not slowed and a flood is
        # not queued in Nginx's memory.
        #
        # auth: a burst of 10 covers a person's sign-in sequence arriving together
        limit_req zone=phaemos_auth burst=10 nodelay;
        # ingest: a burst of 60 covers every one of fifty nodes sending at once after an
        # outage or a reboot of the proxy, once each, with room for a retry
        limit_req zone=phaemos_ingest burst=60 nodelay;
        # everything else: a burst of 40 covers a dashboard page load, which asks for a
        # dozen things at once
        limit_req zone=phaemos_api burst=40 nodelay;

        # 100 connections an address for everything else. A node posts every 5 seconds and holds
        # one kept-alive connection (or opens one per post and closes it, which holds none for
        # long), so a site with fifty nodes behind a shared address uses about fifty. 100 leaves
        # room for that and for browsers. Each proxied request holds two Nginx connections (the
        # client and the API), so 100 here is 200 of the 4096 that install.sh sets.
        limit_conn api_per_addr 100;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # the API trusts X-Real-IP only from the proxy and uses it as the rate limit key
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
